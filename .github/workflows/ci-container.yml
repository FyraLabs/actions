name: Build CI image

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - ci-image/**
      - .github/workflows/ci-container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci-container
          file: ci-container/Containerfile
          push: true
          tags: ghcr.io/fyralabs/ci:f44
          cache-from: type=gha,scope=fyralabs-ci-f44
          cache-to: type=gha,mode=max,scope=fyralabs-ci-f44
